[project]
name = "threat-hunting-platform"
version = "1.0.0"
description = "Threat hunting orchestration platform with control server and edge nodes"
requires-python = ">=3.9"
dependencies = [
    # FastAPI and web framework dependencies
    "fastapi",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.0",
    "aiofiles==23.2.1",
    
    # HTTP client
    "httpx>=0.28.1",
    
    # Logging
    "colorlog>=6.8.0",
    
    # WebSockets (updated to be compatible with google-genai)
    "websockets>=13.0",
    
    # Database dependencies
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
    
    # Authentication and security
    "python-jose[cryptography]==3.3.0",

    "google-genai==1.28.0",
    
    # Web scraping and parsing
    "beautifulsoup4==4.12.2",
    
    # System monitoring
    "psutil>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app", "edge-backend/app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]