[project]
name = "threat-hunting-control-server"
version = "1.0.0"
description = "Control server for threat hunting orchestration platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "sqlalchemy==2.0.23",
    "httpx==0.25.2",
    "websockets==12.0",
    "google-generativeai==0.3.2",
    "python-multipart==0.0.6",
    "python-jose[cryptography]==3.3.0",
    "python-dotenv==1.0.0",
    "beautifulsoup4==4.12.2",
    "aiofiles==23.2.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]